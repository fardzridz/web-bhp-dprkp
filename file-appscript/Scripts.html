<script>
const state={boot:null,page:'dashboard',masterType:'items',trxType:'receipt',editing:null,issueStock:{}};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const money=v=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(v)||0);
const number=v=>new Intl.NumberFormat('id-ID',{maximumFractionDigits:2}).format(Number(v)||0);
const date=v=>v?new Intl.DateTimeFormat('id-ID',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(v+'T00:00:00')):'-';
function call(action,payload={}){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(r=>r&&r.ok?resolve(r.data):reject(new Error(r?.error||'Respons server tidak valid.'))).withFailureHandler(reject).api(action,payload));}
function toast(msg,error=false){const el=$('#toast');el.textContent=msg;el.className='toast show'+(error?' error':'');setTimeout(()=>el.className='toast',3200)}
async function busy(fn){$('#loading').classList.remove('hidden');try{return await fn()}catch(e){toast(e.message||String(e),true);throw e}finally{$('#loading').classList.add('hidden')}}
function clone(id){return document.importNode($(id).content,true)}
function setPageMeta(title,eye){$('#pageTitle').textContent=title;$('#pageEyebrow').textContent=eye}
function canEdit(){return ['ADMIN','OPERATOR'].includes(state.boot.user.PERAN)} function isAdmin(){return state.boot.user.PERAN==='ADMIN'}

document.addEventListener('DOMContentLoaded',()=>busy(async()=>{state.boot=await call('bootstrap');const u=state.boot.user;$('#userName').textContent=u.NAMA||u.EMAIL;$('#userRole').textContent=u.PERAN;$('#userInitial').textContent=(u.NAMA||u.EMAIL)[0].toUpperCase();$('#today').textContent=new Intl.DateTimeFormat('id-ID',{weekday:'long',day:'numeric',month:'long'}).format(new Date());bindShell();await navigate('dashboard')}));
function bindShell(){$$('#nav .nav-item').forEach(b=>b.onclick=()=>navigate(b.dataset.page));$('#menuBtn').onclick=()=>$('.sidebar').classList.toggle('open');document.body.addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go)navigate(go.dataset.go)})}
async function navigate(page){state.page=page;$$('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('.sidebar').classList.remove('open');const c=$('#content');c.innerHTML='';if(page==='dashboard')await renderDashboard(c);if(page==='receipt'||page==='issue')await renderTransactions(c,page);if(page==='stock')await renderStock(c);if(page==='master')await renderMaster(c);if(page==='reports')renderReports(c)}
async function renderDashboard(c){setPageMeta('Beranda','RINGKASAN HARI INI');c.append(clone('#dashboardTpl'));const d=await call('dashboard');const cards=[['Jenis barang',d.itemCount],['Jumlah stok',number(d.stockQuantity)],['Nilai persediaan',money(d.stockValue)],['Stok menipis',d.lowStockCount]];$('#metrics').innerHTML=cards.map(x=>`<div class="metric"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('');$('#lowStock').innerHTML=d.lowStock.length?d.lowStock.map(r=>`<div class="stock-row"><div><strong>${esc(r.name)}</strong><small>${esc(r.category)}</small></div><span class="badge warn">${number(r.quantity)} ${esc(r.unit)}</span></div>`).join(''):'<p class="muted">Tidak ada barang di bawah batas minimum.</p>'}
async function renderTransactions(c,type){state.trxType=type;const incoming=type==='receipt';setPageMeta(incoming?'Barang masuk':'Barang keluar',incoming?'PENERIMAAN PERSEDIAAN':'PENYERAHAN PERSEDIAAN');c.append(clone('#transactionTpl'));if(!canEdit())$('#addTransaction').hidden=true;$('#trxHead').innerHTML=`<tr><th>Tanggal</th><th>ID / Dokumen</th><th>Unit</th><th>Status</th><th></th></tr>`;const data=await call('listTransactions',{type,filters:{}});renderTrxRows(data);$('#addTransaction').onclick=()=>prepareTransactionForm(type);$('#trxSearch').oninput=()=>renderTrxRows(data);$('#trxStatus').onchange=()=>renderTrxRows(data)}
function renderTrxRows(data){const q=normalize($('#trxSearch').value),st=$('#trxStatus').value,units=index(state.boot.masters.orgUnits);const list=data.filter(r=>(!st||r.STATUS===st)&&(!q||normalize(JSON.stringify(r)).includes(q)));$('#trxBody').innerHTML=list.length?list.map(r=>`<tr><td>${date(r.TANGGAL)}</td><td><strong>${esc(r.ID)}</strong><br><small>${esc(r.NO_FAKTUR||r.NO_DOKUMEN||'Tanpa nomor')}</small></td><td>${esc(units[r.UNIT_ID]?.NAMA||'-')}</td><td><span class="badge ${r.STATUS==='DIBATALKAN'?'cancel':''}">${esc(r.STATUS)}</span></td><td><div class="row-actions"><button class="mini" onclick="editTrx('${r.ID}')">Lihat</button>${canEdit()&&r.STATUS!=='DIBATALKAN'?`<button class="mini" onclick="cancelTrx('${r.ID}')">Batalkan</button>`:''}</div></td></tr>`).join(''):'<tr><td colspan="5" class="empty-state">Belum ada transaksi.</td></tr>'}
async function prepareTransactionForm(type,existing){if(type==='issue'){const stock=await busy(()=>call('stock',{filters:{}}));state.issueStock=stock.reduce((out,r)=>(out[r.id]={quantity:r.quantity+(existing?.details||[]).filter(d=>d.BARANG_ID===r.id).reduce((s,d)=>s+Number(d.JUMLAH||0),0),unit:r.unit,name:r.name,layers:r.layers},out),{})}openTransactionForm(type,existing)}
async function editTrx(id){const data=await busy(()=>call('getTransaction',{type:state.trxType,id}));prepareTransactionForm(state.trxType,data)}
async function cancelTrx(id){if(!confirm('Batalkan transaksi ini? Stok akan dihitung ulang.'))return;await busy(()=>call('cancelTransaction',{type:state.trxType,id}));toast('Transaksi dibatalkan.');navigate(state.trxType)}
function openTransactionForm(type,existing){const incoming=type==='receipt',h=existing?.header||{},details=existing?.details||[];$('#modalTitle').textContent=(existing?'Ubah ':'Tambah ')+(incoming?'barang masuk':'barang keluar');const vendors=opts(state.boot.masters.vendors,h.VENDOR_ID),units=opts(state.boot.masters.orgUnits,h.UNIT_ID);$('#modalBody').innerHTML=`<div class="form-grid transaction-form"><div class="field"><label for="fDate">Tanggal *</label><input id="fDate" type="date" value="${h.TANGGAL||new Date().toISOString().slice(0,10)}"></div>${incoming?`<div class="field"><label for="fVendor">Vendor *</label><select id="fVendor">${vendors}</select></div><div class="field"><label for="fDoc">Nomor faktur</label><input id="fDoc" value="${esc(h.NO_FAKTUR||'')}"></div><div class="field"><label for="fBa">Nomor berita acara</label><input id="fBa" value="${esc(h.NO_BA||'')}"></div>`:`<div class="field"><label for="fDoc">Nomor dokumen</label><input id="fDoc" value="${esc(h.NO_DOKUMEN||'')}"></div>`}<div class="field"><label for="fUnit">${incoming?'Unit/kegiatan':'Unit tujuan'} *</label><select id="fUnit">${units}</select></div><div class="field"><label for="fNote">Keterangan</label><input id="fNote" value="${esc(h.KETERANGAN||'')}"></div><section class="line-items"><div class="line-items-head"><div><strong>Daftar barang</strong><small>${incoming?'Isi barang, jumlah, dan harga satuan.':'Hanya barang yang memiliki stok dapat dipilih.'}</small></div><button id="addLine" class="btn add-line" type="button">+ Tambah barang</button></div><div id="lines" class="lines"></div></section><section id="trxTotals" class="transaction-totals" aria-live="polite"></section><div class="form-actions modal-actions"><button class="btn secondary" type="button" onclick="$('#modal').close()">Batal</button>${canEdit()?'<button id="saveTrx" class="btn primary" type="button">Simpan transaksi</button>':''}</div></div>`;const lines=$('#lines');(details.length?details:[{}]).forEach(d=>addLine(lines,type,d));$('#addLine').onclick=()=>addLine(lines,type,{});if($('#saveTrx'))$('#saveTrx').onclick=()=>saveTrx(type,h.ID);updateTransactionTotals(type);$('#modal').showModal();$('#fDate').focus()}
function addLine(box,type,d){const row=document.createElement('div');row.className='line-row';const available=type==='issue'?Object.entries(state.issueStock).filter(([id,s])=>s.quantity>0||id===d.BARANG_ID).map(([id,s])=>({ID:id,NAMA:s.name+' — stok '+number(s.quantity)+' '+s.unit})):state.boot.masters.items;row.innerHTML=`<div class="line-field item-field"><label>Barang *</label><select class="li-item">${opts(available,d.BARANG_ID)}</select>${type==='issue'?'<small class="stock-hint">Pilih barang untuk melihat stok tersedia.</small>':''}</div><div class="line-field qty-field"><label>Jumlah *</label><input class="li-qty" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0" value="${d.JUMLAH||''}"></div>${type==='receipt'?`<div class="line-field price-field"><label>Harga satuan *</label><input class="li-price" type="number" min="0" step="1" inputmode="numeric" placeholder="Rp 0" value="${d.HARGA_SATUAN||''}"></div>`:`<div class="line-field price-field"><label>Harga satuan FIFO</label><output class="li-fifo-price">Rp0</output><small class="price-hint">Otomatis dari stok terlama.</small></div>`}<button class="remove-line" type="button" aria-label="Hapus barang" title="Hapus barang">×</button>`;const select=$('.li-item',row),qty=$('.li-qty',row),price=$('.li-price',row);if(type==='issue'){const hint=$('.stock-hint',row);const sync=()=>{const s=state.issueStock[select.value],q=Number(qty.value)||0,value=fifoEstimate(select.value,q),average=q?value/q:((s?.layers||[])[0]?.price||0);qty.max=s?s.quantity:'';hint.textContent=s?`Tersedia ${number(s.quantity)} ${s.unit}.`:'Pilih barang untuk melihat stok tersedia.';$('.li-fifo-price',row).textContent=money(average);$('.price-hint',row).textContent=q&&s&&s.layers?.length>1?'Harga rata-rata sesuai lapisan FIFO yang terpakai.':'Otomatis dari stok terlama.';updateTransactionTotals(type)};select.onchange=sync;qty.oninput=()=>{const s=state.issueStock[select.value];qty.setCustomValidity(s&&Number(qty.value)>s.quantity?`Jumlah melebihi stok tersedia (${number(s.quantity)} ${s.unit}).`:'');sync()};sync()}else{select.onchange=()=>updateTransactionTotals(type);qty.oninput=()=>updateTransactionTotals(type);price.oninput=()=>updateTransactionTotals(type)}row.querySelector('.remove-line').onclick=()=>{if(box.children.length>1){row.remove();updateTransactionTotals(type)}else toast('Transaksi harus memiliki minimal satu barang.',true)};box.append(row);updateTransactionTotals(type)}
function fifoEstimate(itemId,qty){const s=state.issueStock[itemId];if(!s)return 0;let left=Number(qty)||0,value=0;(s.layers||[]).forEach(l=>{if(left<=0)return;const used=Math.min(left,Number(l.quantity)||0);value+=used*(Number(l.price)||0);left-=used});return value}
function updateTransactionTotals(type){const box=$('#trxTotals');if(!box)return;const rows=$$('.line-row'),valid=rows.filter(r=>$('.li-item',r).value),qty=valid.reduce((sum,r)=>sum+(Number($('.li-qty',r).value)||0),0),value=valid.reduce((sum,r)=>{const q=Number($('.li-qty',r).value)||0;return sum+(type==='receipt'?q*(Number($('.li-price',r)?.value)||0):fifoEstimate($('.li-item',r).value,q))},0);box.innerHTML=`<div><span>Jenis barang</span><strong>${valid.length}</strong></div><div><span>Total jumlah</span><strong>${number(qty)}</strong></div><div class="total-value"><span>${type==='receipt'?'Total pembelian':'Total nilai FIFO'}</span><strong>${money(value)}</strong></div>`}
async function saveTrx(type,id){const button=$('#saveTrx'),original=button?.textContent;const rows=$$('.line-row');if(type==='issue'){for(const r of rows){const item=$('.li-item',r).value,s=state.issueStock[item],qty=Number($('.li-qty',r).value);if(s&&qty>s.quantity){toast(`Jumlah ${s.name} melebihi stok tersedia ${number(s.quantity)} ${s.unit}.`,true);$('.li-qty',r).focus();return}}}if(button){button.disabled=true;button.textContent='Menyimpan…'}const data={ID:id,TANGGAL:$('#fDate').value,UNIT_ID:$('#fUnit').value,KETERANGAN:$('#fNote').value,details:rows.map(r=>({BARANG_ID:$('.li-item',r).value,JUMLAH:$('.li-qty',r).value,HARGA_SATUAN:$('.li-price',r)?.value||0}))};if(type==='receipt'){data.VENDOR_ID=$('#fVendor').value;data.NO_FAKTUR=$('#fDoc').value;data.NO_BA=$('#fBa').value}else{data.NO_DOKUMEN=$('#fDoc').value;data.TGL_PENYERAHAN=data.TANGGAL}try{await busy(()=>call('saveTransaction',{type,data}));$('#modal').close();toast('Transaksi tersimpan dan stok diperbarui.');await refreshBoot();navigate(type)}catch(e){if(button){button.disabled=false;button.textContent=original}}}
async function renderStock(c){setPageMeta('Stok barang','POSISI PERSEDIAAN SAAT INI');c.append(clone('#stockTpl'));const data=await call('stock',{filters:{}});const draw=()=>{const q=normalize($('#stockSearch').value),list=data.filter(r=>normalize(r.code+' '+r.name).includes(q));$('#stockBody').innerHTML=list.map(r=>`<tr><td><strong>${esc(r.name)}</strong><br><small>${esc(r.code||'-')}</small></td><td>${esc(r.category)}</td><td class="num">${number(r.quantity)}</td><td>${esc(r.unit)}</td><td class="num"><strong>${money(r.unitPrice)}</strong>${r.priceLayerCount>1?`<br><small class="muted">Rata-rata ${r.priceLayerCount} harga aktif</small>`:''}</td><td class="num">${money(r.value)}</td><td><span class="badge ${r.quantity<=r.minimum?'warn':''}">${r.quantity<=r.minimum?'Menipis':'Aman'}</span></td><td>${canEdit()&&r.quantity>0?`<button class="mini" onclick="openAdjustment('${r.id}')">Kurangi stok</button>`:''}</td></tr>`).join('')};draw();$('#stockSearch').oninput=draw;$('#refreshStock').onclick=()=>navigate('stock')}
function openAdjustment(id){const s=state.boot.masters.items.find(x=>x.ID===id);call('stock',{filters:{itemId:id}}).then(rows=>{const stock=rows[0];if(!stock||stock.quantity<=0){toast('Barang ini tidak memiliki stok.',true);return}$('#modalTitle').textContent='Penyesuaian stok';$('#modalBody').innerHTML=`<div class="adjustment-summary"><span>Stok tercatat</span><strong>${number(stock.quantity)} ${esc(stock.unit)}</strong><small>${esc(stock.name)}</small></div><div class="form-grid transaction-form"><div class="field"><label>Tanggal *</label><input id="aDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Alasan *</label><select id="aReason"><option value="RUSAK">Barang rusak</option><option value="HILANG">Barang hilang</option><option value="KOREKSI">Koreksi hasil stok opname</option></select></div><div class="field"><label>Jumlah dikurangi *</label><input id="aQty" type="number" min="0.01" max="${stock.quantity}" step="0.01" value=""></div><div class="field"><label>Keterangan *</label><input id="aNote" placeholder="Contoh: rusak terkena air"></div><div class="form-actions modal-actions"><button class="btn secondary" type="button" onclick="$('#modal').close()">Batal</button><button id="saveAdjustment" class="btn danger" type="button">Kurangi stok</button></div></div>`;$('#saveAdjustment').onclick=()=>saveAdjustment(id,stock);$('#modal').showModal()}).catch(e=>toast(e.message||String(e),true))}
async function saveAdjustment(itemId,stock){const qty=Number($('#aQty').value);if(!(qty>0)||qty>stock.quantity){toast(`Jumlah harus antara 0 dan ${number(stock.quantity)} ${stock.unit}.`,true);return}if(!$('#aNote').value.trim()){toast('Keterangan penyesuaian wajib diisi.',true);$('#aNote').focus();return}if(!confirm(`Kurangi stok ${stock.name} sebanyak ${number(qty)} ${stock.unit}? Tindakan ini masuk laporan dan audit.`))return;await busy(()=>call('adjustStock',{data:{TANGGAL:$('#aDate').value,BARANG_ID:itemId,JUMLAH:qty,ALASAN:$('#aReason').value,KETERANGAN:$('#aNote').value}}));$('#modal').close();toast('Stok berhasil disesuaikan.');await refreshBoot();navigate('stock')}
const masterDefs={items:['Barang','Kode','Nama','Kategori','Satuan','Stok minimum'],categories:['Kategori','Nama'],units:['Satuan','Nama'],orgUnits:['Unit kerja','Nama'],vendors:['Vendor','Nama','Alamat','Telepon'],users:['Pengguna','Email','Nama','Peran']};
async function renderMaster(c){setPageMeta('Master data','PUSAT REFERENSI DATA');c.innerHTML='';c.append(clone('#masterTpl'));if(!isAdmin())$('#addMaster').hidden=true;$('#masterTabs').innerHTML=Object.entries(masterDefs).filter(([k])=>isAdmin()||k!=='users').map(([k,v])=>`<button class="tab ${k===state.masterType?'active':''}" data-type="${k}">${v[0]}</button>`).join('');$$('.tab').forEach(b=>b.onclick=()=>{state.masterType=b.dataset.type;renderMaster(c)});const data=await call('listMaster',{type:state.masterType,includeInactive:true});renderMasterRows(data);$('#masterSearch').oninput=()=>renderMasterRows(data);$('#addMaster').onclick=()=>openMasterForm()}
function renderMasterRows(data){const t=state.masterType,q=normalize($('#masterSearch').value),list=data.filter(r=>normalize(JSON.stringify(r)).includes(q));const heads=masterDefs[t].slice(1);$('#masterHead').innerHTML='<tr>'+heads.map(h=>`<th>${h}</th>`).join('')+'<th>Status</th><th></th></tr>';const cats=index(state.boot.masters.categories),units=index(state.boot.masters.units);$('#masterBody').innerHTML=list.map(r=>{let vals=t==='items'?[r.KODE,r.NAMA,cats[r.KATEGORI_ID]?.NAMA,units[r.SATUAN_ID]?.NAMA,r.STOK_MINIMUM]:t==='vendors'?[r.NAMA,r.ALAMAT,r.TELEPON]:t==='users'?[r.EMAIL,r.NAMA,r.PERAN]:[r.NAMA];return `<tr>${vals.map(v=>`<td>${esc(v??'-')}</td>`).join('')}<td><span class="badge ${r.STATUS!=='AKTIF'?'cancel':''}">${esc(r.STATUS)}</span></td><td>${isAdmin()?`<div class="row-actions"><button class="mini" onclick='openMasterForm(${JSON.stringify(r)})'>Ubah</button>${r.STATUS==='AKTIF'?`<button class="mini" onclick="removeMaster('${r.ID}')">Nonaktifkan</button>`:''}</div>`:''}</td></tr>`}).join('')}
function openMasterForm(r={}){const t=state.masterType;$('#modalTitle').textContent=(r.ID?'Ubah ':'Tambah ')+masterDefs[t][0];let fields=t==='items'?`<div class="field"><label>Kode</label><input id="mCode" value="${esc(r.KODE||'')}"></div><div class="field"><label>Nama *</label><input id="mName" value="${esc(r.NAMA||'')}"></div><div class="field"><label>Kategori *</label><select id="mCat">${opts(state.boot.masters.categories,r.KATEGORI_ID)}</select></div><div class="field"><label>Satuan *</label><select id="mUnit">${opts(state.boot.masters.units,r.SATUAN_ID)}</select></div><div class="field"><label>Stok minimum</label><input id="mMin" type="number" min="0" value="${r.STOK_MINIMUM||0}"></div>`:t==='vendors'?`<div class="field"><label>Nama *</label><input id="mName" value="${esc(r.NAMA||'')}"></div><div class="field"><label>Alamat</label><input id="mAddress" value="${esc(r.ALAMAT||'')}"></div><div class="field"><label>Telepon</label><input id="mPhone" value="${esc(r.TELEPON||'')}"></div>`:t==='users'?`<div class="field"><label>Email *</label><input id="mEmail" value="${esc(r.EMAIL||'')}"></div><div class="field"><label>Nama *</label><input id="mName" value="${esc(r.NAMA||'')}"></div><div class="field"><label>Peran *</label><select id="mRole">${['ADMIN','OPERATOR','VIEWER'].map(x=>`<option ${x===r.PERAN?'selected':''}>${x}</option>`)}</select></div>`:`<div class="field full"><label>Nama *</label><input id="mName" value="${esc(r.NAMA||'')}"></div>`;$('#modalBody').innerHTML=`<div class="form-grid">${fields}<div class="form-actions"><button type="button" class="btn secondary" onclick="$('#modal').close()">Batal</button><button id="saveMaster" type="button" class="btn primary">Simpan</button></div></div>`;$('#saveMaster').onclick=async()=>{const d={ID:r.ID,NAMA:$('#mName')?.value,STATUS:r.STATUS||'AKTIF'};if(t==='items')Object.assign(d,{KODE:$('#mCode').value,KATEGORI_ID:$('#mCat').value,SATUAN_ID:$('#mUnit').value,STOK_MINIMUM:$('#mMin').value});if(t==='vendors')Object.assign(d,{ALAMAT:$('#mAddress').value,TELEPON:$('#mPhone').value});if(t==='users')Object.assign(d,{EMAIL:$('#mEmail').value,PERAN:$('#mRole').value});await busy(()=>call('saveMaster',{type:t,data:d}));$('#modal').close();toast('Data tersimpan.');await refreshBoot();renderMaster($('#content'))};$('#modal').showModal()}
async function removeMaster(id){if(!confirm('Nonaktifkan data ini? Riwayat lama tetap tersimpan.'))return;await busy(()=>call('deleteMaster',{type:state.masterType,id}));toast('Data dinonaktifkan.');await refreshBoot();renderMaster($('#content'))}
function renderReports(c){setPageMeta('Laporan','CETAK DAN PEMERIKSAAN');c.append(clone('#reportsTpl'));$$('.report-card').forEach(b=>b.onclick=()=>setupReport(b.dataset.report))}
function cardPickerHtml(){const categories=state.boot.masters.categories||[];return `<div class="card-picker"><label class="card-all"><input id="rAllItems" type="checkbox" checked> Cetak semua barang aktif</label><div class="card-picker-filters"><input id="rItemSearch" type="search" placeholder="Cari kode atau nama barang…" disabled><select id="rItemCategory" disabled><option value="">Semua kategori</option>${categories.map(x=>`<option value="${esc(x.ID)}">${esc(x.NAMA)}</option>`).join('')}</select></div><div class="card-picker-actions"><button id="rSelectVisible" type="button" class="btn secondary" disabled>Pilih semua hasil</button><button id="rClearItems" type="button" class="btn secondary" disabled>Hapus pilihan</button><span id="rItemResult"></span></div><div id="rItemList" class="card-item-list" aria-label="Daftar barang"></div><small id="rItemCount"></small></div>`}
function setupCardPicker(){const items=state.boot.masters.items||[],categories=index(state.boot.masters.categories||[]),selected=new Set(),all=$('#rAllItems'),search=$('#rItemSearch'),category=$('#rItemCategory'),list=$('#rItemList'),selectVisible=$('#rSelectVisible'),clear=$('#rClearItems'),count=$('#rItemCount'),result=$('#rItemResult');const filtered=()=>{const q=normalize(search.value),cat=category.value;return items.filter(x=>(!cat||x.KATEGORI_ID===cat)&&(!q||normalize(`${x.KODE||''} ${x.NAMA||''}`).includes(q)))};const sync=()=>{const everything=all.checked;[search,category,selectVisible,clear].forEach(x=>x.disabled=everything);const rows=everything?[]:filtered();list.hidden=everything;list.innerHTML=rows.length?rows.map(x=>`<label class="card-item-option"><input type="checkbox" value="${esc(x.ID)}" ${selected.has(x.ID)?'checked':''}><span><strong>${esc(x.NAMA)}</strong><small>${esc(x.KODE||'Tanpa kode')} · ${esc(categories[x.KATEGORI_ID]?.NAMA||'Tanpa kategori')}</small></span></label>`).join(''):'<div class="card-item-empty">Barang tidak ditemukan.</div>';result.textContent=everything?'':`${rows.length} hasil`;count.textContent=everything?`${items.length} barang aktif akan dicetak`:`${selected.size} barang dipilih`;$$('input[type="checkbox"]',list).forEach(box=>box.onchange=()=>{box.checked?selected.add(box.value):selected.delete(box.value);count.textContent=`${selected.size} barang dipilih`})};all.onchange=sync;search.oninput=sync;category.onchange=sync;selectVisible.onclick=()=>{filtered().forEach(x=>selected.add(x.ID));sync()};clear.onclick=()=>{selected.clear();sync()};sync();return()=>all.checked?[]:[...selected]}
async function setupReport(type){$$('.report-card').forEach(b=>b.classList.toggle('active',b.dataset.report===type));if(type==='settings'){renderReportSettings();return}const item=type==='card'?cardPickerHtml():'';let trx='';if(type==='warehouseSlip'){const list=await call('listTransactions',{type:'issue',filters:{status:'AKTIF'}});trx=`<select id="rTrx"><option value="">Pilih transaksi keluar…</option>${list.map(x=>`<option value="${x.ID}">${date(x.TANGGAL)} — ${esc(x.NO_DOKUMEN||x.ID)}</option>`).join('')}</select>`}$('#reportControls').innerHTML=`<div class="report-form ${type==='card'?'card-report-form':''}">${item}${trx}<input id="rStart" type="date" value="${new Date().getFullYear()}-01-01"><input id="rEnd" type="date" value="${new Date().toISOString().slice(0,10)}"><input id="rSign" type="date" value="${new Date().toISOString().slice(0,10)}" title="Tanggal tanda tangan"><button id="runReport" class="btn primary">Tampilkan</button><button onclick="window.print()" class="btn secondary">Cetak / PDF</button></div>`;state.cardSelection=type==='card'?setupCardPicker():null;$('#runReport').onclick=()=>runReport(type)}
async function runReport(type){const filters={start:$('#rStart').value,end:$('#rEnd').value,signDate:$('#rSign').value,transactionId:$('#rTrx')?.value};if(type==='card'){filters.itemIds=state.cardSelection();if(!$('#rAllItems').checked&&!filters.itemIds.length){toast('Pilih minimal satu barang atau gunakan Cetak semua barang aktif.',true);return}const data=await busy(()=>call('cards',{filters}));const out=$('#reportOutput');out.className='official-print cards-print';out.innerHTML=OfficialPrint.render(data);return}const data=await busy(()=>call('officialReport',{type,filters}));const out=$('#reportOutput');out.className='official-print';out.innerHTML=OfficialPrint.render(data)}
function renderReportSettings(){const s=state.boot.settings,fields=[['NAMA_INSTANSI','Nama instansi'],['KAB_KOTA','Kabupaten/Kota'],['PROVINSI','Provinsi'],['TEMPAT_TTD','Tempat TTD'],['JABATAN_ATASAN','Jabatan atasan'],['NAMA_ATASAN','Nama atasan'],['NIP_ATASAN','NIP atasan'],['PANGKAT_ATASAN','Pangkat atasan'],['JABATAN_PENGURUS','Jabatan pengurus'],['NAMA_PENGURUS','Nama pengurus'],['NIP_PENGURUS','NIP pengurus'],['PANGKAT_PENGURUS','Pangkat pengurus'],['JABATAN_KEPALA','Jabatan kepala'],['NAMA_KEPALA','Nama kepala'],['NIP_KEPALA','NIP kepala'],['PANGKAT_KEPALA','Pangkat kepala']];$('#reportControls').innerHTML='';$('#reportOutput').className='';$('#reportOutput').innerHTML=`<div class="form-grid settings-grid">${fields.map(x=>`<div class="field"><label>${x[1]}</label><input data-setting="${x[0]}" value="${esc(s[x[0]]||'')}" ${isAdmin()?'':'disabled'}></div>`).join('')}${isAdmin()?'<div class="form-actions"><button id="saveSettings" class="btn primary">Simpan pengaturan</button></div>':''}</div>`;if(isAdmin())$('#saveSettings').onclick=async()=>{const data={};$$('[data-setting]').forEach(x=>data[x.dataset.setting]=x.value);state.boot.settings=await busy(()=>call('saveReportSettings',{data}));toast('Pengaturan laporan tersimpan.')}}
function opts(data,selected){return '<option value="">Pilih…</option>'+data.map(x=>`<option value="${x.ID}" ${x.ID===selected?'selected':''}>${esc(x.NAMA||x.EMAIL)}</option>`).join('')} function index(a){return a.reduce((o,x)=>(o[x.ID]=x,o),{})} function normalize(v){return String(v||'').toLowerCase().trim()} async function refreshBoot(){state.boot=await call('bootstrap')}
</script>
